name: Verify

# Every vendored skill must match its recorded digest and its upstream commit.
#
# Triggered by pushes to any branch, never by `pull_request`: a pull request
# opened by the update job's Actions token would otherwise record a run that
# fails before it starts, every week. A branch push checks a pull request's
# commits just the same, and pushes made by that token start nothing.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/skills.py verify --fetch
