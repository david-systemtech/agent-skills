name: Update skills

# Weekly: move every skill to its upstream's newest commit, open a pull
# request showing what changed, and merge it once the copy is proven to be
# byte-identical to upstream. A failed check leaves the pull request open.

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Look for newer upstream commits
        id: update
        run: python3 scripts/skills.py update --summary "$RUNNER_TEMP/summary.md"

      - name: Open the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="update/skills-$(date -u +%Y-%m-%d)-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A skills skills.json
          git commit --quiet -m "Update vendored skills"
          git push --quiet -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update vendored skills ($(date -u +%Y-%m-%d))" \
            --body-file "$RUNNER_TEMP/summary.md"
          echo "branch=$branch" >> "$GITHUB_ENV"

      # The gate for merging unattended. Branch protection is not available to
      # a private repo on the free plan, so the check runs here, before the merge.
      - name: Verify against upstream
        if: steps.update.outputs.changed == 'true'
        run: python3 scripts/skills.py verify --fetch

      - name: Merge
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "$branch" --squash --delete-branch
